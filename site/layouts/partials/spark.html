{{ $m := .m }}{{ $id := .id }}
<defs>
  <linearGradient id="sg-{{ $id }}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="currentColor" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="currentColor" stop-opacity="0.01"/>
  </linearGradient>
</defs>
<polygon points="{{ $m.area }}" fill="url(#sg-{{ $id }})" class="spark-area"/>
<polyline points="{{ $m.trace }}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" class="spark-line"/>
{{ with $m.peak_xy }}<circle cx="{{ index . 0 }}" cy="{{ index . 1 }}" r="3.2" fill="currentColor" class="spark-peak"/>{{ end }}
