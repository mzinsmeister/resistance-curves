name: Publish Resistance Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
      - name: Install catalog dependencies
        run: python -m pip install .
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
          HUGO_RELATIVEURLS: "false"
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
