<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .IsHome }}Machine Library{{ else }}{{ .Title }}{{ end }} · LoadCurve</title>
  <link rel="stylesheet" href="{{ "atlas.css" | relURL }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ "index.html" | relURL }}">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M2 17 C6 17, 7 6, 12 6 C17 6, 18 14, 22 10"/>
            <circle cx="12" cy="6" r="2.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="brand-text">
          <strong>LoadCurve</strong>
          <small>Open Machine Resistance Library</small>
        </span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a class="nav-link{{ if .IsHome }} is-active{{ end }}" href="{{ "index.html" | relURL }}">Library</a>
        <span class="nav-pill">{{ len .Site.RegularPages }} curves</span>
        <a class="nav-github" href="https://github.com/mzinsmeister/resistance-curves" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.09.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.22-3.37-1.22-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.08 0-1.12.39-2.04 1.03-2.76-.1-.26-.45-1.31.1-2.73 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85 0 1.71.12 2.51.35 1.91-1.33 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.64 1.03 2.76 0 3.95-2.34 4.82-4.57 5.07.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.59.69.49A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
          </svg>
          <span>Contribute</span>
        </a>
      </nav>
    </div>
  </header>
  <main class="wrap main-content">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span><strong>LoadCurve</strong> · Open plate-loaded machine mechanics</span>
      <span class="footer-note">
        Curves derived from verified geometry &amp; visual evidence ·
        <a href="https://github.com/mzinsmeister/resistance-curves" target="_blank" rel="noopener">Contribute to the library on GitHub ↗</a>
      </span>
    </div>
  </footer>
</body>
</html>
